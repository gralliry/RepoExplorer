<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepoExplorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 仓库选择 -->
  <header class="toolbar">
    <label class="field grow">
      <span>仓库</span>
      <input id="repo" type="text" spellcheck="false"
             placeholder="owner/repo 或 https://github.com/owner/repo" />
    </label>
    <label class="field">
      <span>分支</span>
      <select id="ref"><option value="">默认分支</option></select>
    </label>
    <div class="field auth-field">
      <span>认证</span>
      <button id="auth-btn" class="ghost auth-btn">登录 GitHub</button>
    </div>
    <button id="load" class="primary">打开仓库</button>
  </header>

  <!-- 地址栏 / 工具栏 -->
  <div class="navbar">
    <button id="nav-back" class="nav-btn" title="后退 (Alt+←)">←</button>
    <button id="nav-forward" class="nav-btn" title="前进 (Alt+→)">→</button>
    <button id="nav-up" class="nav-btn" title="上一级 (Backspace)">↑</button>

    <div id="breadcrumb" class="breadcrumb" title="点击可编辑完整路径"></div>

    <input id="filter" type="search" class="nav-search" placeholder="搜索文件（递归整个仓库）" />

    <button id="view-toggle" class="ghost" title="切换视图">详细信息</button>
    <button id="refresh" class="ghost" title="刷新 (F5)">刷新</button>
    <button id="new-menu" class="ghost" title="新建">新建 ▾</button>
    <button id="upload-menu" class="ghost" title="上传">上传 ▾</button>
    <button id="download" class="primary" title="下载选中的文件">下载</button>
  </div>

  <!-- 内容区 -->
  <main class="content">
    <div id="list" class="list">
      <div class="empty">输入仓库后点「打开仓库」<br />加载完成后，双击文件夹进入，双击文件编辑</div>
    </div>
  </main>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <span id="status-items">尚未加载仓库</span>
    <span id="status-dest" class="status-dest" title="点击更改下载目录"></span>
    <span id="status-progress" class="status-progress"></span>
  </footer>

  <!-- ---------------------------------------------------------- auth modal -->
  <div id="auth-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <span>GitHub 认证</span>
        <button id="auth-close" class="icon-btn" title="关闭">✕</button>
      </div>

      <div class="modal-body">
        <section id="auth-view-user" class="hidden">
          <div class="muted">当前认证方式</div>
          <div class="auth-user" id="auth-user-name">—</div>
          <div class="muted" id="auth-user-source"></div>
          <button id="auth-logout" class="ghost wide">退出 / 清除凭据</button>
        </section>

        <section id="auth-view-code" class="hidden">
          <p class="muted">浏览器里应该已经打开了授权页面。在那里输入下面的验证码：</p>
          <div class="code-row">
            <span id="auth-user-code" class="user-code">········</span>
            <button id="auth-copy" class="ghost">复制</button>
          </div>
          <p class="muted" id="auth-code-status">等待你在浏览器中授权…</p>
          <div class="row-btns">
            <button id="auth-open" class="ghost">重新打开浏览器</button>
            <button id="auth-cancel" class="ghost">取消</button>
          </div>
        </section>

        <section id="auth-view-setup">
          <button id="auth-start" class="primary wide">用 GitHub 登录</button>
          <p class="muted">浏览器会打开 GitHub 授权页，把界面上显示的验证码填进去即可。</p>
          <div class="divider"><span>或者</span></div>
          <label class="field">
            <span>手动填写 Personal Access Token</span>
            <input id="auth-token" type="password" spellcheck="false"
                   placeholder="ghp_… / github_pat_…" />
          </label>
          <button id="auth-save-token" class="ghost wide">使用这个 Token</button>
        </section>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------- prompt modal -->
  <div id="prompt-modal" class="modal-backdrop hidden">
    <div class="modal narrow">
      <div class="modal-head">
        <span id="prompt-title">输入</span>
        <button id="prompt-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="muted" id="prompt-hint"></p>
        <label class="field">
          <span id="prompt-label">名称</span>
          <input id="prompt-input" type="text" spellcheck="false" />
        </label>
        <div id="prompt-extra-wrap" class="hidden">
          <label class="field">
            <span id="prompt-extra-label">内容</span>
            <textarea id="prompt-extra" class="editor short" spellcheck="false"></textarea>
          </label>
        </div>
        <div class="row-btns">
          <button id="prompt-cancel" class="ghost">取消</button>
          <button id="prompt-ok" class="primary">确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------ confirm modal -->
  <div id="confirm-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <span id="confirm-title">确认</span>
        <button id="confirm-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="muted" id="confirm-message"></p>
        <div id="confirm-list" class="change-list"></div>
        <div class="row-btns">
          <button id="confirm-cancel" class="ghost">取消</button>
          <button id="confirm-ok" class="primary danger">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------- editor modal -->
  <div id="editor-modal" class="modal-backdrop hidden">
    <div class="modal wide-modal">
      <div class="modal-head">
        <span id="editor-title">编辑</span>
        <button id="editor-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="muted" id="editor-hint"></p>
        <textarea id="editor-text" class="editor" spellcheck="false"></textarea>
        <div class="row-btns">
          <button id="editor-cancel" class="ghost">取消</button>
          <button id="editor-save" class="primary">保存并提交</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------ context menu -->
  <div id="ctx-menu" class="ctx-menu hidden"></div>

  <div id="toast" class="toast"></div>
  <script src="main.js"></script>
</body>
</html>
