name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            archive: zip
            binary: RepoExplorer.exe
          - name: linux-amd64
            os: ubuntu-22.04
            archive: tar.gz
            binary: RepoExplorer
          - name: macos-amd64
            os: macos-13
            archive: zip
            app: RepoExplorer.app
          - name: macos-arm64
            os: macos-14
            archive: zip
            app: RepoExplorer.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build application
        run: wails build -clean

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/bin/${{ matrix.binary }}" -DestinationPath "dist/RepoExplorer-${{ github.ref_name }}-${{ matrix.name }}.zip" -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist package/RepoExplorer
          cp "build/bin/${{ matrix.binary }}" package/RepoExplorer/
          chmod +x package/RepoExplorer/${{ matrix.binary }}
          tar -czf "dist/RepoExplorer-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C package RepoExplorer

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/bin/${{ matrix.app }}" "dist/RepoExplorer-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoExplorer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: RepoExplorer ${{ steps.version.outputs.value }}
          files: dist/*
          generate_release_notes: true
